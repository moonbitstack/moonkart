name: Docs

# Publishes docs/ to GitHub Pages on every push to master. The demo engine is
# built here rather than committed, and the API page is regenerated so a stale
# interface cannot ship.

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install moonbit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: compile the demo engine
        run: |
          moon update
          moon build src/web --target js --release
          mkdir -p docs/engine
          cp _build/js/release/build/web/web.js docs/engine/cache.js

      - name: regenerate the api page
        run: |
          python3 scripts/gen_api.py
          git diff --exit-code docs/api.html

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
